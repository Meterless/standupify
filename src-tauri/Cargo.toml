[package]
name = "sitcomify"
version = "0.1.0"
description = "Sitcomify Network — Local-First v1 (Tauri 2 shell)"
authors = ["Sam"]
edition = "2021"
rust-version = "1.77"

# Used by Tauri's bundling — must match `productName` in tauri.conf.json.
[lib]
name = "sitcomify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
